# .goreleaser.yml — runs on `goreleaser release` (locally) or in CI
# on `git tag v*`. See https://goreleaser.com for full schema.
# --parallelism 1 is required: per-target sidecars share the embed directory.
version: 2

project_name: gavetero

# Dynamic version from the current git tag.
# Override with --snapshot for nightly builds.
# The Makefile also builds locally with -ldflags.
before:
  hooks:
    - go mod download

builds:
  - main: ./cmd/gavetero
    binary: gavetero
    id: gavetero
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Quiarom/gavetero/cmd/gavetero/cmd.version={{ .Version }}
    hooks:
      pre:
        - cmd: go build -trimpath -ldflags="-s -w -X github.com/Quiarom/gavetero/cmd/router-core/cmd.version={{ .Version }}" -o cmd/gavetero/cmd/sidecars/router-core ./cmd/router-core
          env:
            - GOOS={{ .Os }}
            - GOARCH={{ .Arch }}
            - CGO_ENABLED=0
        - cmd: go build -trimpath -ldflags="-s -w -X main.version={{ .Version }}" -o cmd/gavetero/cmd/sidecars/router-core-agent ./cmd/router-core-agent
          env:
            - GOOS={{ .Os }}
            - GOARCH={{ .Arch }}
            - CGO_ENABLED=0

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - NOTICE

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: Quiarom
    name: gavetero
  draft: true
  header: |
    ## Gavetero {{ .Tag }}

    [Full changelog](https://github.com/Quiarom/gavetero/compare/{{ .PreviousTag }}...{{ .Tag }})
  footer: |
    ## Install

    ```sh
    curl -sSf https://raw.githubusercontent.com/Quiarom/gavetero/{{ .Tag }}/install.sh | GAVETERO_VERSION={{ .Tag }} bash
    ```

  prerelease: '{{ .Prerelease }}'
  mode: replace

snapshot:
  version_template: "{{ incpatch .Version }}-next"
